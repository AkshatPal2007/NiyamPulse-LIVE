name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-production.lock.txt -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m scripts.build_release
      - run: npm --prefix frontend audit --omit=dev --audit-level=moderate
      - run: python -m pytest -q
      - run: python -m backend.schemas
      - run: python -m scripts.export_openapi
      - run: npm --prefix frontend run types
      - run: git diff --exit-code --ignore-space-at-eol -- frontend/src/generated/api.d.ts
